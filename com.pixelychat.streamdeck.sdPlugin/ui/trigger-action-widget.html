<!DOCTYPE html>
<html>

<head lang="en">
    <title>Trigger Action Widget Settings</title>
    <meta charset="utf-8" />
    <!-- sdpi-components v4.0.1, bundled so the panel also works offline. -->
    <script src="sdpi-components.js"></script>
    <!-- Strings per Stream Deck language; must load before the elements below render. -->
    <script src="locales.js"></script>
    <style>
        /* Same box as sdpi-item's label (flex-centered, min-height 28px) so both sit on one line. */
        #connection { display: flex; align-items: center; min-height: 28px; }
        #connection.connected { color: #8B5CF6; }
        #connection.warning { color: #E8A23D; }
        #hint { opacity: 0.75; line-height: 1.4; }
        #hint.warning { color: #E8A23D; opacity: 1; }
    </style>
</head>

<body>
    <sdpi-item label="PixelyChat">
        <span id="connection"></span>
    </sdpi-item>

    <sdpi-item label="__MSG_actionWidget__">
        <sdpi-select setting="widgetId" datasource="getWidgets" hot-reload placeholder="__MSG_selectWidget__"></sdpi-select>
    </sdpi-item>

    <sdpi-item>
        <span id="hint"></span>
    </sdpi-item>

    <script>
        const t = (key) => SDPIComponents.i18n.getMessage(key);
        const connection = document.getElementById("connection");
        const hint = document.getElementById("hint");
        connection.textContent = t("connecting");
        // `loading` is not translated by sdpi-components itself.
        document.querySelector("sdpi-select").setAttribute("loading", t("loading"));

        function show(label, labelClass, text, textClass) {
            connection.textContent = t(label);
            connection.className = labelClass;
            hint.textContent = t(text);
            hint.className = textClass;
        }

        // The plugin sends { event: "status" } right after each widget list update.
        SDPIComponents.streamDeckClient.sendToPropertyInspector.subscribe(({ payload }) => {
            if (!payload || payload.event !== "status") return;
            if (payload.connection === "needsUpdate") show("updateNeeded", "warning", "hintUpdate", "warning");
            else if (payload.connection !== "connected") show("notRunning", "", "hintNotRunning", "");
            else if (payload.missing) show("connected", "connected", "hintMissing", "warning");
            else if (payload.empty) show("connected", "connected", "hintEmpty", "");
            else show("connected", "connected", "hintReady", "");
        });
    </script>
</body>

</html>
